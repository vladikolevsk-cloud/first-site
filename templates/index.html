<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" >
    <meta charset="UTF-8">
    <title>Dota 2 Рандомайзер</title>
</head>
<body>

    <h1>Dota 2 Рандомайзер</h1>

    <div class="controls">
        <button id="random-btn" class="btn-gold">Рандом!</button>
        <button id="role-btn" class="btn-gold">Роль + Шанс на победу</button>
    </div>

    <div id="hero-box"></div>
    <div id="inventory-box"></div>

    <div id="role-result">
        <div id="role-name"></div>
        <div id="chance-value">0%</div>
        <div id="chance-caption"></div>
    </div>

<script>
const SLOT_SIZE = 84;   
const REEL_FRAMES = 16; 

const heroBox = document.getElementById("hero-box");
const inventoryBox = document.getElementById("inventory-box");
const randomBtn = document.getElementById("random-btn");

const roleBtn = document.getElementById("role-btn");
const roleResult = document.getElementById("role-result");
const roleName = document.getElementById("role-name");
const chanceValue = document.getElementById("chance-value");
const chanceCaption = document.getElementById("chance-caption");


const CAPTIONS = {
    low:  ["чувак гг походу", "Мона и по миду йти"],
    mid:  ["Нада запотеть" , "в теории мона виграть"],
    high: ["Бустак на миде изи вин", "халявние +40 птс" ],
};

function pickCaption(chance) {
    let pool;
    if (chance <= 30) pool = CAPTIONS.low;
    else if (chance <= 65) pool = CAPTIONS.mid;
    else pool = CAPTIONS.high;
    return pool[Math.floor(Math.random() * pool.length)];
}


function animateCounter(target, durationMs) {
    const start = performance.now();
    function tick(now) {
        const progress = Math.min((now - start) / durationMs, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        chanceValue.textContent = Math.round(eased * target) + "%";
        if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

function buildReel(finalSrc, pool, index) {
    const reel = document.createElement("div");
    reel.className = "reel spinning";

    const strip = document.createElement("div");
    strip.className = "reel-strip";

    
    for (let i = 0; i < REEL_FRAMES - 1; i++) {
        const img = document.createElement("img");
        img.src = pool[Math.floor(Math.random() * pool.length)];
        strip.appendChild(img);
    }
    const finalImg = document.createElement("img");
    finalImg.src = finalSrc;
    strip.appendChild(finalImg);

    reel.appendChild(strip);

    
    strip.style.transitionDuration = "0s";
    strip.style.transform = "translateY(0)";

    const delay = 0.5 + index * 0.18; 
    const duration = 1.1 + index * 0.15;


    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            strip.style.transitionDelay = delay + "s";
            strip.style.transitionDuration = duration + "s";
            strip.style.transform = `translateY(-${(REEL_FRAMES - 1) * SLOT_SIZE}px)`;

            
            setTimeout(() => {
                reel.classList.remove("spinning");
                reel.classList.add("settled");
            }, (delay + duration) * 1000);
        });
    });

    return reel;
}

randomBtn.addEventListener("click", () => {
    randomBtn.disabled = true;

    fetch('/api/random')
    .then(response => response.json())
    .then(data => {
        heroBox.innerHTML = `<img src="${data.hero.image}" alt="${data.hero.name}">`;

        inventoryBox.innerHTML = "";
        const pool = data.inventory.map(item => item.image);

        let lastDelayMs = 0;
        data.inventory.forEach((item, index) => {
            const reel = buildReel(item.image, pool, index);
            inventoryBox.appendChild(reel);
            const totalMs = (0.5 + index * 0.18 + 1.1 + index * 0.15) * 1000;
            if (totalMs > lastDelayMs) lastDelayMs = totalMs;
        });

        setTimeout(() => { randomBtn.disabled = false; }, lastDelayMs + 100);
    });
});

roleBtn.addEventListener("click", () => {
    roleBtn.disabled = true;
    roleResult.classList.remove("show");
    chanceCaption.textContent = "";
    chanceValue.textContent = "0%";

    fetch('/api/role')
    .then(response => response.json())
    .then(data => {
        roleName.textContent = data.role;

        
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                roleResult.classList.add("show");
            });
        });

        
        setTimeout(() => {
            animateCounter(data.win_chance, 900);
            setTimeout(() => {
                chanceCaption.textContent = pickCaption(data.win_chance);
                roleBtn.disabled = false;
            }, 950);
        }, 400);
    });
});
</script>
</body>
</html>
